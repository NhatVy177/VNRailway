<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  lang="vi"
  th:replace="~{layout/main :: layout(~{::#login-content}, 'Đăng nhập cho nhân viên')}"
>
  <div id="login-content">
    <section class="auth-page">
      <div class="auth-page__container">
        <div class="auth-card">
          <h1 class="auth-card__title">Đăng nhập cho nhân viên</h1>

          <!-- Form -->
          <form class="auth-form" method="post" th:action="@{/login}">
            <!-- Mã nhân viên -->
            <div class="auth-form__group">
              <label for="employee-id" class="auth-form__label">Mã nhân viên</label>
              <input
                type="text"
                id="employee-id"
                name="username"
                class="input"
                placeholder="Nhập mã nhân viên"
                required
              />
            </div>

            <!-- Password -->
            <div class="auth-form__group">
              <label for="password" class="auth-form__label">Mật khẩu</label>
              <input
                type="password"
                id="password"
                name="password"
                class="input"
                placeholder="Nhập mật khẩu"
                required
              />
            </div>

            <!-- Thông báo lỗi -->
            <div
              class="auth-form__alert"
              th:if="${error}"
              th:text="${error}"
            ></div>

            <!-- Nút submit -->
            <button type="submit" class="auth-form__button">Đăng nhập</button>
          </form>

          <!-- Link -->
          <div class="auth-card__footer">
            <p class="auth-card__text">
              <span>Bạn là khách hàng? </span>
              <a href="/login" class="auth-card__link"
                >Đăng nhập cho khách hàng</a
              >
            </p>
          </div>          
        </div>
      </div>
    </section>
  </div>
</html>
