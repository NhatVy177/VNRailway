<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(~{::section}, 'Thêm chuyến tàu')}"
>
  <section>
    <div class="main__container">
      <h1 class="main__title">Thêm chuyến tàu</h1>

      <div class="form-card">
        <form
          class="form"
          hx-post="/manager/trips/"
          hx-target="#modal-root"
          hx-swap="innerHTML"
          x-data="{
            routeId: null,
            departureTime: '',
            trainId: null,

            setup(rId, dTime, tId) {
              if (dTime && dTime.includes(',')) {
                  const parts = dTime.split(',').filter(p => p.trim() !== '');
                  dTime = parts[parts.length - 1]; 
              }

              this.routeId = (rId === 'null' || rId === '') ? null : rId;
              this.departureTime = (dTime === 'null' || dTime === '') ? '' : dTime;
              this.trainId = (tId === 'null' || tId === '') ? null : tId;
            },

            isValid() {
                return this.routeId !== null && this.departureTime !== '';
            },

            selectTrain() {
              if (!this.isValid()) return;
              window.location.href = `/manager/trains/select?routeId=${this.routeId}&time=${this.departureTime}&returnUrl=/manager/trips/new`;
            }
          }"
          th:x-init="|setup('${routeId}', '${departureTime}', '${trainId}')|"
        >
          <!-- Tuyến -->
          <div class="form__group">
            <label class="form__label">
              Tuyến <span class="form__required">*</span>
            </label>
            <div class="form__control form__control--with-button">
              <input
                type="text"
                class="input"
                readonly
                required
                th:value="${routeName}"
              />
              <input
                type="hidden"
                name="routeId"
                x-model="routeId"
                th:value="${routeId}"
              />
              <a
                th:href="@{/manager/routes/select(returnUrl='/manager/trips/new', departureTime=${departureTime})}"
                class="btn btn--primary"
                @click="if(departureTime) $el.href += '&departureTime=' + departureTime"
              >
                Chọn tuyến
              </a>
            </div>
          </div>

          <!-- Thời gian xuất phát -->
          <div class="form__group">
            <label class="form__label">
              Thời gian xuất phát <span class="form__required">*</span>
            </label>
            <div class="form__control form__control--single">
              <input
                type="datetime-local"
                name="departureTime"
                class="input"
                x-model="departureTime"
                th:x-init="|departureTime = '${departureTime != null ? departureTime : ''}'|"
                required
              />
            </div>
          </div>

          <!-- Đoàn tàu -->
          <div class="form__group">
            <label class="form__label">
              Đoàn tàu <span class="form__required">*</span>
            </label>
            <div class="form__control form__control--with-button">
              <input
                type="text"
                class="input"
                readonly
                required
                th:value="${trainName}"
              />
              <input
                type="hidden"
                name="trainId"
                x-model="trainId"
                th:value="${trainId}"
              />
              <button
                type="button"
                class="btn btn--primary"
                @click="selectTrain()"
                :disabled="!isValid()"
                :class="{ 'btn--disabled': !isValid() }"
              >
                Chọn tàu
              </button>
            </div>
          </div>

          <!-- Submit -->
          <div class="form__actions">
            <button type="submit" class="btn btn--primary">Thêm</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</html>
