<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(~{::section}, 'Lịch sử chuyến tàu')}"
>
  <section>
    <link rel="stylesheet" th:href="@{/css/pages/manager/train-management.css}" />

    <div class="main__container">
      <div class="train-header">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h1 class="main__title mb-2">
              <i class="bi bi-clock-history"></i>
              Lịch sử chuyến tàu
            </h1>
            <p class="mb-0" style="opacity: 0.9;">
              Đoàn tàu: <strong th:text="${train.id + ' - ' + train.name}"></strong> 
              (<span th:text="${train.manufacturer}"></span>)
            </p>
          </div>
          <a th:href="@{/manager/trains}" class="train-btn train-btn-secondary">
            <i class="bi bi-arrow-left"></i> Quay lại
          </a>
        </div>
      </div>

      <div class="train-filter-card">
        <div class="card-title">
          <i class="bi bi-calendar-range"></i>
          Lọc theo thời gian
        </div>
        <form th:action="@{/manager/trains/{id}/history(id=${train.id})}" method="get" class="row g-3">
          <div class="col-md-4">
            <label for="tuNgay" class="form-label">
              <i class="bi bi-calendar-check"></i> Từ ngày
            </label>
            <input 
              type="date" 
              name="tuNgay" 
              id="tuNgay" 
              class="form-control" 
              th:value="${tuNgay}"
            />
          </div>
          <div class="col-md-4">
            <label for="denNgay" class="form-label">
              <i class="bi bi-calendar-x"></i> Đến ngày
            </label>
            <input 
              type="date" 
              name="denNgay" 
              id="denNgay" 
              class="form-control" 
              th:value="${denNgay}"
            />
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="train-btn train-btn-primary me-2">
              <i class="bi bi-search"></i> Lọc
            </button>
            <a th:href="@{/manager/trains/{id}/history(id=${train.id})}" class="train-btn train-btn-secondary">
              <i class="bi bi-arrow-clockwise"></i> Làm mới
            </a>
          </div>
        </form>
      </div> <div class="train-table-card train-fade-in">
        <div class="train-table-header">
          <h5>
            <i class="bi bi-journal-text"></i>
            Lịch sử hoạt động
          </h5>
        </div>
        <div class="table-responsive">
          <table class="train-table">
            <thead>
              <tr>
                <th><i class="bi bi-tag"></i> Mã chuyến</th>
                <th><i class="bi bi-clock"></i> Thời gian</th>
                <th><i class="bi bi-signpost"></i> Tuyến</th>
                <th><i class="bi bi-geo-alt"></i> Ga đi - Ga đến</th>
                <th><i class="bi bi-rulers"></i> Khoảng cách</th>
                <th><i class="bi bi-check-circle"></i> Trạng thái</th>
                <th><i class="bi bi-ticket"></i> Số vé</th>
                <th><i class="bi bi-people"></i> Nhân viên</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${histories == null or histories.isEmpty()}">
                <td colspan="8">
                  <div class="train-empty-state">
                    <i class="bi bi-inbox"></i>
                    <p>Không có dữ liệu lịch sử</p>
                  </div>
                </td>
              </tr>
              <tr th:each="history : ${histories}" class="train-history-item">
                <td>
                  <div class="train-code">
                    <i class="bi bi-hash"></i>
                    <span th:text="${history.maChuyenTau}"></span>
                  </div>
                </td>
                <td>
                  <i class="bi bi-calendar3"></i>
                  <span th:text="${#temporals.format(history.thoiGianXuatPhat, 'dd/MM/yyyy HH:mm')}"></span>
                </td>
                <td>
                  <div>
                    <small class="text-muted" th:text="${history.maTuyen}"></small>
                  </div>
                  <div><strong th:text="${history.tenTuyen}"></strong></div>
                </td>
                <td>
                  <div class="train-route-info">
                    <div class="train-station departure">
                      <i class="bi bi-arrow-right-circle-fill"></i>
                      <span th:text="${history.gaDi}"></span>
                    </div>
                    <div class="train-station arrival">
                      <i class="bi bi-geo-alt-fill"></i>
                      <span th:text="${history.gaDen}"></span>
                    </div>
                  </div>
                </td>
                <td>
                  <strong th:text="${#numbers.formatDecimal(history.khoangCach, 0, 2)}"></strong> km
                </td>
                <td>
                  <span 
                    class="train-status-badge"
                    th:classappend="${history.trangThai == 'R' ? 'status-normal' : 
                                     history.trangThai == 'S' ? 'status-warning' : 
                                     history.trangThai == 'F' ? 'status-normal' : 'status-danger'}"
                    th:text="${history.moTaTrangThai}"
                  ></span>
                </td>
                <td>
                  <span class="badge bg-info" th:text="${history.soVeBan}"></span> vé
                </td>
                <td>
                  <div style="font-size: 0.9em;">
                    <i class="bi bi-people-fill"></i>
                    <strong th:text="${history.soLaiTau}"></strong> lái,
                    <strong th:text="${history.soNhanVienPhucVu}"></strong> PV
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div> <nav th:if="${totalPages > 1}" aria-label="Phân trang">
          <ul class="train-pagination">
            <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
              <a 
                class="page-link" 
                th:href="@{/manager/trains/{id}/history(id=${train.id}, page=${currentPage - 1}, tuNgay=${tuNgay}, denNgay=${denNgay})}"
              >
                <i class="bi bi-chevron-left"></i> Trước
              </a>
            </li>
            
            <li 
              th:each="i : ${#numbers.sequence(1, totalPages)}" 
              class="page-item"
              th:classappend="${i == currentPage ? 'active' : ''}"
            >
              <a 
                class="page-link" 
                th:href="@{/manager/trains/{id}/history(id=${train.id}, page=${i}, tuNgay=${tuNgay}, denNgay=${denNgay})}"
                th:text="${i}"
              ></a>
            </li>
            
            <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
              <a 
                class="page-link" 
                th:href="@{/manager/trains/{id}/history(id=${train.id}, page=${currentPage + 1}, tuNgay=${tuNgay}, denNgay=${denNgay})}"
              >
                Sau <i class="bi bi-chevron-right"></i>
              </a>
            </li>
          </ul>
        </nav>

        <div class="train-stats-footer">
          <i class="bi bi-info-circle"></i>
          Hiển thị <strong th:text="${histories != null ? histories.size() : 0}"></strong> 
          trong tổng số <strong th:text="${totalElements ?: 0}"></strong> chuyến tàu
        </div>

      </div> </div> </section>
</html>
