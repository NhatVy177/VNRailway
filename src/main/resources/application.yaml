app:
  mode: ${MODE:NORMAL}

server:
  port: ${SERVER_PORT}

spring:
  application:
    name: VNRailWay

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

    thymeleaf:
      cache: false

    web:
      resources:
        cache:
          period: 0
        chain:
          cache: false
